# Install as /etc/nginx/snippets/butcher-headers.conf (name used in nginx.conf.example).
# Include in EVERY location that defines its own add_header (NGINX inheritance).
#
# frame-src: only the DISH reservation widget (opened on demand in a <dialog>).
# fonts are self-hosted, so style-src/font-src stay 'self'.
#
# When you enable analytics / Turnstile, extend the policy BEFORE shipping:
#   Google Analytics/Ads: script-src += https://www.googletagmanager.com
#                         connect-src += https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com
#                         img-src     += https://*.google-analytics.com https://*.googletagmanager.com
#   Cloudflare Turnstile: script-src += https://challenges.cloudflare.com
#                         frame-src  += https://challenges.cloudflare.com
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://images.unsplash.com https://res.cloudinary.com; font-src 'self'; connect-src 'self' https://res.cloudinary.com; frame-src https://reservation.dish.co; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# payment=() blocks Payment Request API also inside the DISH iframe. If the booking
# widget takes deposits, test it and change to: payment=(self "https://reservation.dish.co")
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
